app-id: net.kuribo64.melonDS
runtime: org.kde.Platform
runtime-version: 6.10
sdk: org.kde.Sdk
command: melonDS
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=all
  - --persist=.
modules:
  - name: libpcap
    cleanup:
      - /include
    sources:
      - type: archive
        url: https://www.tcpdump.org/release/libpcap-1.10.6.tar.gz
        sha256: 872dd11337fe1ab02ad9d4fee047c9da244d695c6ddf34e2ebb733efd4ed8aa9
        x-checker-data:
          type: anitya
          project-id: 1702
          stable-only: true
          url-template: https://www.tcpdump.org/release/libpcap-$version.tar.gz

  - name: libslirp
    buildsystem: meson
    sources:
      - type: git
        url: https://gitlab.freedesktop.org/slirp/libslirp.git
        tag: v4.9.4
        commit: d09dc9a70360ee7838acccbd234ab83f3b9b37a5
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: libenet
    sources:
      - type: git
        url: https://github.com/lsalzman/enet.git
        tag: v1.3.18
        commit: 2662c0de09e36f2a2030ccc2c528a3e4c9e8138a
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: script
        commands: [autoreconf -vfi]

  - name: faad2
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/knik0/faad2
        tag: 2.11.3
        commit: 6918ebb51b8f7e86278da15884bd7114e4b9661e
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: melonds
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      build-args:
        - --share=network
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_QT6=ON
    sources:
      - type: git
        url: https://github.com/Arisotura/melonDS.git
        tag: '1.1'
        commit: b86390e4428bf38ce4c1ce0e9ca446d6d25955e8
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
          is-main-source: true
      - type: file
        path: net.kuribo64.melonDS.appdata.xml
      - type: shell
        commands:
          - git fetch
          - git cherry-pick -n 4cc34121b0db2cf77541014271af8d79fed35f26
    post-install:
      - install -D -m644 -t /app/share/appdata/ ../${FLATPAK_ID}.appdata.xml
